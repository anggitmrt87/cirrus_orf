  TZ: "Asia/Jakarta"
  LANG: "C.UTF-8"
  LC_ALL: "C"
  
  # CCache Configuration
  CCACHE_DIR: "/cirrus/ccache"
  CCACHE_SIZE: "20G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  USE_CCACHE: "1"
  CCACHE_MAXSIZE: "20G"
  
  FOX_SYNC: "https://gitlab.com/OrangeFox/sync.git"
  FOX_SYNC_BRANCH: "14.1"
  KERNEL_PATH: "kernel/xiaomi/chime"
  DEVICE_TREE: "https://github.com/MRT-project/ORF_device_xiaomi_chime"
