  TG_TOKEN: "ENCRYPTED[1e27955a3fc4a69f981fc5fb3b4ac78b75b49e350c048111b3d85316f2a9d9fa7febf27322b64ffed8c52d081735a69a]"
  GH_TOKEN: "ENCRYPTED[fb8594a22366f18877e9c49a4ac890e912667a3e5efc7fe3c43d3b53a1295b6588663ae1b7eea5a8d3beb875cf4dbaa0]"

task:
  name: "🦊 OrangeFox Recovery Builder"
  timeout_in: 3h
  container:
    image: mhmmdfdlyas/dockerfile:r-ubuntu
    cpu: 8
    memory: 32G

  # Persistent CCache Configuration
  ccache_cache:
    folder: /cirrus/ccache
    fingerprint_script:
      - echo "v1"
    populate_script:
      - mkdir -p /cirrus/ccache

  setup_script:
    - apt-get update
    - apt-get install -y sudo curl wget git jq figlet aria2 python3-all-dev apt-utils
    - apt-get install -y libtinfo6 libncurses6 libncurses-dev libncurses5-dev lsb-release lsb-base ccache
    - echo 'en_US.UTF-8 UTF-8' > /etc/locale.gen && /usr/sbin/locale-gen
    - ln -snf /usr/share/zoneinfo/"$TZ" /etc/localtime && echo "$TZ" > /etc/timezone
    - mkdir -p /cirrus/ccache
    - ccache -M 20G
    - ccache -o compression=true
    - ccache -o compression_level=6
    - apt-get update

  build_environment_script:
    - git clone https://github.com/akhilnarang/scripts.git -b master .sc
    - sudo bash .sc/setup/android_build_env.sh

  sync_script:
    - ./sync.sh

  build_script:
    - ./build.sh
